server:
  port: ${SERVER_PORT:9006}

spring:
  application:
    name: ai-agent-service
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}
  mvc:
    async:
      request-timeout: 300000   # 5 minutes
  cache:
    type: redis
  data:
    redis:
      host: ${SPRING_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_REDIS_PORT:${REDIS_PORT:6379}}
      timeout: 60000
  ai:
    ollama:
      base-url: http://${OLLAMA_HOST:localhost}:${OLLAMA_PORT:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen3:8b}
          temperature: 0.7

feign:
  client:
    config:
      default:
        connect-timeout: 10000
        read-timeout: 60000


