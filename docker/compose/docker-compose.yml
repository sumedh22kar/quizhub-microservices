version: "3.9"

name: quizhub

services:

  postgres-db:
    image: postgres:17
    container_name: quizhub-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: quizhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - quizhub-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis-cache:
    image: redis:7-alpine
    container_name: quizhub-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - quizhub-network

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:

  postgres-data:

  redis-data:


networks:

  quizhub-network:
    driver: bridge